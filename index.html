<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ThChang | Graduation Invitation</title>
  <meta property="og:title" content="ThChang | Graduation Invitation">
  <meta property="og:image" content="thu_moi_cua_trang.png">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,700;1,600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Canvas Falling Stars & Sparkles -->
  <canvas id="stars-canvas" aria-hidden="true"></canvas>

  <!-- Background Music Audio -->
  <audio id="wedding-audio" autoplay loop preload="auto" playsinline src="./audio.mp3"></audio>

  <!-- Opening Screen: Scrapbook Graduation Envelope Theme -->
  <section id="invitation-gate" class="invitation-gate" role="dialog" aria-modal="true" aria-labelledby="gate-title">
    <div class="gate-envelope">
      <!-- Decorative scrapbook badge matching card style -->
      <div class="envelope-badge">
        <span class="badge-ribbon">🎀</span>
        <span class="badge-text">LỄ TỐT NGHIỆP • 2026</span>
      </div>

      <!-- Wax seal / Graduation Cap Centerpiece -->
      <div class="envelope-seal-icon">
        <span class="seal-emoji">🎓</span>
        <span class="seal-sparkle">✨</span>
      </div>

      <h1 id="gate-title" class="gate-title">Thư Mời</h1>

      <p class="gate-quote">“Thank you for being a part of my youth”</p>
      
      <p class="gate-sub">Trân trọng kính mời bạn mở thiệp cùng ThChang ✨</p>

      <!-- The Redesigned Open Button matching image style -->
      <button id="open-invitation-btn" class="open-invitation-btn" type="button" aria-label="Mở thư mời">
        <span class="btn-shimmer"></span>
        <span class="btn-icon">💌</span>
        <span class="btn-text-wrap">
          <span class="btn-main-title">Mở Thư Mời</span>
          <span class="btn-sub-title">Chạm để mở thiệp &amp; bật nhạc ♫</span>
        </span>
        <span class="btn-arrow">✨</span>
      </button>

      <div class="envelope-footer-deco">
        <span class="deco-dot"></span>
        <span class="deco-dot gold"></span>
        <span class="deco-dot"></span>
      </div>
    </div>
  </section>

  <!-- Floating Music Toggle Button -->
  <button id="music-btn" class="floating-music-btn" aria-label="Bật nhạc nền" aria-pressed="false" title="Bật/Tắt nhạc">
    <div class="vinyl-disc"></div>
    <div class="eq-bars">
      <span class="eq-bar"></span>
      <span class="eq-bar"></span>
      <span class="eq-bar"></span>
    </div>
  </button>

  <!-- Mobile Invitation Showcase (Only 1 image) -->
  <main class="invitation-screen">
    <div id="card-frame" class="card-frame">
      <img 
        id="invitation-img"
        src="thu_moi_cua_trang.png" 
        alt="Thư mời dự lễ tốt nghiệp" 
        class="invitation-img"
        loading="eager"
      >
    </div>
  </main>

  <script src="script.js"></script>
</body>

</html>
